events {}
http {
    access_log off;
    server_tokens off;
    client_max_body_size 8k;
    proxy_connect_timeout 3s;
    proxy_read_timeout 35s;
    server {
        listen 8069;
        client_max_body_size 16m;
        # Integration API calls stay on the internal network.
        location ^~ /json/2/ { return 404; }
        location = /jsonrpc { return 404; }
        location ^~ /xmlrpc { return 404; }
        location ^~ /web/database { return 404; }
        location / {
            proxy_pass http://odoo:8069;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Odoo-Database ma2f_pilot;
        }
    }
    server {
        listen 8080;
        location / {
            proxy_pass http://gateway:8080;
            proxy_set_header Host $host;
        }
    }
}
