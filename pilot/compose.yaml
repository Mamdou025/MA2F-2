name: ma2f-odoo-pilot

services:
  db:
    image: postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [management]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U odoo -d postgres]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  odoo:
    image: odoo:19.0@sha256:f99ffac95cb39a0924622ea4118481c95651d9c84187e5b30a21c2cc4419c7dd
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.local/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons:ro
      - ./scripts:/opt/ma2f:ro
      - ./.local:/run/ma2f
      - odoo-data:/var/lib/odoo
    networks: [management]
    restart: unless-stopped

  gateway:
    image: python:3.12-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
    command: [python, -B, /app/server.py]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DATABASE: ma2f_pilot
      PYTHONPATH: /opt/contract
    volumes:
      - ./gateway:/app:ro
      - ./.local/odoo-api-key:/run/secrets/odoo_api_key:ro
      - ./.local/gateway-token:/run/secrets/gateway_token:ro
      - ./.local/gateway-writer-token:/run/secrets/gateway_writer_token:ro
      - ./.local/odoo-writer-key:/run/secrets/odoo_writer_key:ro
      - ./.local/production-enabled:/run/secrets/production_enabled:ro
      - ./addons/ma2f_pilot_commands:/opt/contract:ro
    networks: [management]
    depends_on: [odoo]
    restart: unless-stopped

  ingress:
    image: nginx:stable-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    entrypoint: [nginx, -g, "daemon off;"]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["127.0.0.1:18069:8069", "127.0.0.1:18080:8080"]
    networks: [management, ingress]
    depends_on: [odoo, gateway]
    restart: unless-stopped

networks:
  ingress: {}
  management:
    internal: true

volumes:
  postgres-data:
  odoo-data:

secrets:
  db_password:
    file: ./.local/db-password
